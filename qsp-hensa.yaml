  75094f17-e08c-4f9d-b073-1a5c69c4346b:
    x: 6
    description: 'YARA used as part of the verdict reason  '
    height: 4
    queryString: |-
      #event_simpleName=MalwareAnalysisPlatformQuickScanProResult
      | regex("YARA", field=result.verdict_reason, flags=i)
      | detection_method := "YARA"
      | count()
    end: now
    start: 7d
    width: 3
    y: 0
    interactions:
    - name: Drill Down
      queryString: |-
        #event_simpleName=MalwareAnalysisPlatformQuickScanProResult
        | regex("YARA", field=result.verdict_reason, flags=i)
        | detection_method := "YARA"
        | table([@timestamp, sha256, result.verdict, result.malicious_confidence, params.file_name, result.verdict_reason, detection_method, submission_id])
        | sort(@timestamp, order=desc)
      useWidgetTimeWindow: true
      arguments: {}
      openInNewTab: false
      isLive: false
      type: searchlink
    options:
      default: {}
    visualization: single-value
    title: YARA
    isLive: false
    type: query
  f8da22b4-83e5-4d5c-92aa-041c40575c35:
    x: 0
    description: YARA signatures primarily used against file artifacts in combination
      to potentially arrive at a verdict.
    height: 13
    queryString: |
      #event_simpleName=MalwareAnalysisPlatformQuickScanProResult
      | regex("indicator\":\"YARA signature match - (?<yara_signature>[^\"]+)\"", field=@rawstring, flags=i)
      | groupBy([sha256, yara_signature])
      | sankey(source=sha256, target=yara_signature)
    visualization: sankey
    end: now
    start: 30d
    width: 12
    y: 7
    interactions:
    - name: All Results
      queryString: "#event_simpleName=MalwareAnalysisPlatformQuickScanProResult \n\
        | regex(\"indicator\\\":\\\"YARA signature match - (?<yara_signature>[^\\\"\
        ]+)\\\"\",field=@rawstring,flags=i) "
      useWidgetTimeWindow: true
      arguments: {}
      openInNewTab: false
      isLive: false
      type: searchlink
    - name: Drill Down
      queryString: "#event_simpleName=MalwareAnalysisPlatformQuickScanProResult |\
        \ regex(\"indicator\\\":\\\"YARA signature match - (?<yara_signature>[^\\\"\
        ]+)\\\"\",field=@rawstring,flags=i) | yara_signature=?yara_signature sha256=?sha256\
        \ \n| table([@timestamp, sha256, result.verdict, result.malicious_confidence,\
        \ params.file_name, result.verdict_reason, yara_signature, submission_id])\n\
        | sort(@timestamp, order=desc)"
      useWidgetTimeWindow: true
      arguments:
        sha256: '["{{ fields.source }}"]'
        yara_signature: '["{{ fields.target }}"]'
      openInNewTab: false
      isLive: false
      type: searchlink
    title: 'YARA Signatures - Artifacts '
    isLive: false
    type: query
